services:
  - type: web
    name: taskboard-api
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # Optional: set DATABASE_URL if connecting to Render PostgreSQL or Supabase/Neon
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: taskboard-db
      #     property: connectionString

